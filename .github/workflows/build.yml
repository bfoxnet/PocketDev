name: Build Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDev-release
          path: app/build/outputs/apk/release/*.apk

      - name: Upload mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: PocketDev-mapping
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: PocketDev-release
          path: apk

      - name: Create rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(git rev-parse --short HEAD)
          TAG="build-$VERSION"
          gh release delete "$TAG" -y --cleanup 2>/dev/null || true
          gh release create "$TAG" apk/*.apk \
            --title "PocketDev $VERSION" \
            --notes "Automated release build from commit $VERSION. See commit history for changes."
          # Move the rolling "latest" tag to this build
          git fetch --tags origin
          git push origin :refs/tags/latest 2>/dev/null || true
          git tag latest "$VERSION" 2>/dev/null || true
          git push origin latest